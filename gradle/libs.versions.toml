[versions]
agp = "9.4.1"
animationCore = "1.12.1"
core = "1.19.1"
kotlin = "2.4.20"
lifecycle = "2.10.0"
savedstate = "1.4.0"

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }

[libraries]
androidx-annotation = { module = "androidx.annotation:annotation", version = "1.11.0" }
androidx-window = { module = "androidx.window:window", version = "1.5.1" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version = "1.8.0" }
androidx-viewpager = { module = "androidx.viewpager:viewpager", version = "1.1.0" }

androidx-webgpu = { module = "androidx.webgpu:webgpu", version = "1.0.0-alpha06" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version = "1.13.0" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version = "2026.09.00" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation", version = "1.12.1" }
androidx-compose-animation-core = { group = "androidx.compose.animation", name = "animation-core", version.ref = "animationCore" }
androidx-core = { group = "androidx.core", name = "core", version.ref = "core" }
androidx-lifecycle-viewmodel = { module = "androidx.lifecycle:lifecycle-viewmodel", version.ref = "lifecycle" }
androidx-savedstate = { module = "androidx.savedstate:savedstate", version.ref = "savedstate" }
